<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700">
  <rect width="700" height="700" fill="#050705"/>
  <!-- star speckle -->
  <g fill="#a8ff3e">
    <circle cx="80" cy="90" r="1.6" opacity="0.7"/>
    <circle cx="620" cy="140" r="1.2" opacity="0.5"/>
    <circle cx="530" cy="60" r="1.8" opacity="0.6"/>
    <circle cx="150" cy="600" r="1.4" opacity="0.5"/>
    <circle cx="640" cy="560" r="1.6" opacity="0.6"/>
    <circle cx="90" cy="420" r="1.1" opacity="0.4"/>
    <circle cx="360" cy="120" r="1.3" opacity="0.5"/>
    <circle cx="240" cy="220" r="1.0" opacity="0.4"/>
  </g>
  <!-- chromatic echo arcs -->
  <g fill="none" stroke-width="2" opacity="0.5">
    <path d="M 245 455 A 148 148 0 0 1 455 455" stroke="#ff2d5a" transform="translate(-5 0)"/>
    <path d="M 245 455 A 148 148 0 0 1 455 455" stroke="#3c96ff" transform="translate(5 0)"/>
  </g>
  <!-- broadcast rings -->
  <g fill="none" stroke="#a8ff3e">
    <path d="M 305 395 A 64 64 0 0 1 395 395" stroke-width="3" opacity="0.95"/>
    <path d="M 275 425 A 106 106 0 0 1 425 425" stroke-width="2.4" opacity="0.75"/>
    <path d="M 245 455 A 148 148 0 0 1 455 455" stroke-width="2" opacity="0.55"/>
    <path d="M 215 485 A 190 190 0 0 1 485 485" stroke-width="1.6" opacity="0.4"/>
    <path d="M 185 515 A 233 233 0 0 1 515 515" stroke-width="1.2" opacity="0.28"/>
    <path d="M 155 545 A 276 276 0 0 1 545 545" stroke-width="1" opacity="0.18"/>
  </g>
  <!-- antenna / seed -->
  <g>
    <line x1="350" y1="360" x2="350" y2="465" stroke="#dde8d2" stroke-width="2.5"/>
    <path d="M 350 465 L 320 530 L 380 530 Z" fill="none" stroke="#dde8d2" stroke-width="2"/>
    <circle cx="350" cy="352" r="9" fill="#a8ff3e"/>
    <circle cx="350" cy="352" r="20" fill="none" stroke="#a8ff3e" stroke-width="1.4" opacity="0.6"/>
  </g>
  <!-- hexagram whisper -->
  <g fill="none" stroke="#96d25a" opacity="0.16">
    <polygon points="350,105 562,472 138,472" stroke-width="1.4"/>
    <polygon points="350,595 138,228 562,228" stroke-width="1.4"/>
  </g>
  <!-- titles -->
  <g font-family="Courier New, ui-monospace, monospace" text-anchor="middle">
    <text x="350" y="622" fill="#dde8d2" font-size="46" letter-spacing="22" font-weight="bold">SIGNAL</text>
    <text x="350" y="662" fill="#71806a" font-size="15" letter-spacing="8">KNZ x ZNK — ORIGINAL MIX</text>
  </g>
</svg>
